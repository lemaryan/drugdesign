<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 900 1030" role="img"
           aria-label="Vertical pipeline diagram read top to bottom: the LLM proposer sends candidate SMILES down through RDKit validation and filters, Chemprop prediction, objective scoring with diversity selection, DOCKSTRING docking, and into the CSV memory. Rejected molecules branch off validation to the right and also reach memory. A feedback arc returns up the left edge from memory to the proposer.">
        <defs>
          <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#003262"></path>
          </marker>
          <marker id="ar-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#BC9B6A"></path>
          </marker>
        </defs>

        <text x="300" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="1.2" font-weight="700" fill="#BC9B6A">EACH ITERATION NARROWS THE BATCH</text>

        <!-- 1. propose -->
        <g>
          <rect x="120" y="76" width="360" height="96" rx="3" fill="#003262" fill-opacity="0.12" stroke="#003262" stroke-width="2"></rect>
          <text x="140" y="102" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#BC9B6A">1 · PROPOSE</text>
          <text x="140" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#003262">LLM proposer</text>
          <text x="140" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">70% analogs of the best hits so far</text>
          <text x="140" y="163" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">30% genuinely new scaffolds</text>
        </g>
        <!-- 2. validate -->
        <g>
          <rect x="120" y="220" width="360" height="96" rx="3" fill="#003262" fill-opacity="0.12" stroke="#003262" stroke-width="1.5"></rect>
          <text x="140" y="246" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#BC9B6A">2 · VALIDATE</text>
          <text x="140" y="270" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#003262">RDKit + hard filters</text>
          <text x="140" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">parse, de-duplicate,</text>
          <text x="140" y="307" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">8 drug-likeness limits</text>
        </g>
        <!-- 3. predict -->
        <g>
          <rect x="120" y="364" width="360" height="96" rx="3" fill="#003262" fill-opacity="0.12" stroke="#003262" stroke-width="1.5"></rect>
          <text x="140" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#BC9B6A">3 · PREDICT</text>
          <text x="140" y="414" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#003262">Chemprop × 2</text>
          <text x="140" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">JAK2 and LCK affinity,</text>
          <text x="140" y="451" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">whole batch in one call</text>
        </g>
        <!-- 4. score -->
        <g>
          <rect x="120" y="508" width="360" height="96" rx="3" fill="#003262" fill-opacity="0.12" stroke="#003262" stroke-width="1.5"></rect>
          <text x="140" y="534" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#BC9B6A">4 · SCORE</text>
          <text x="140" y="558" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#003262">Rank + diversify</text>
          <text x="140" y="578" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">objective, minus 0.25 ×</text>
          <text x="140" y="595" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">Tanimoto similarity to picks</text>
        </g>
        <!-- 5. dock -->
        <g>
          <rect x="120" y="652" width="360" height="96" rx="3" fill="#BC9B6A" fill-opacity="0.26" stroke="#BC9B6A" stroke-width="2"></rect>
          <text x="140" y="678" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#BC9B6A">5 · DOCK (OPTIONAL)</text>
          <text x="140" y="702" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#003262">DOCKSTRING / Vina</text>
          <text x="140" y="722" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">both targets, separate conda</text>
          <text x="140" y="739" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">worker, the expensive step</text>
        </g>
        <!-- 6. memory -->
        <g>
          <rect x="120" y="800" width="360" height="96" rx="3" fill="#003262" fill-opacity="0.12" stroke="#003262" stroke-width="2"></rect>
          <text x="140" y="826" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#BC9B6A">6 · MEMORY</text>
          <text x="140" y="850" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#003262">experiment_history.csv</text>
          <text x="140" y="870" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">one row per molecule,</text>
          <text x="140" y="887" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">kept or rejected</text>
        </g>

        <!-- downward arrows -->
        <line x1="300" y1="174" x2="300" y2="214" stroke="#003262" stroke-width="2" marker-end="url(#ar-blue)"></line>
        <line x1="300" y1="318" x2="300" y2="358" stroke="#003262" stroke-width="2" marker-end="url(#ar-blue)"></line>
        <line x1="300" y1="462" x2="300" y2="502" stroke="#003262" stroke-width="2" marker-end="url(#ar-blue)"></line>
        <line x1="300" y1="606" x2="300" y2="646" stroke="#BC9B6A" stroke-width="2.5" marker-end="url(#ar-gold)"></line>
        <line x1="300" y1="750" x2="300" y2="794" stroke="#BC9B6A" stroke-width="2.5" marker-end="url(#ar-gold)"></line>

        <!-- batch sizes beside each arrow -->
        <text x="314" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#003262">20 proposed</text>
        <text x="314" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#003262">survivors only</text>
        <text x="314" y="488" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#003262">scored batch</text>
        <text x="314" y="632" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BC9B6A">top 2–5 only</text>
        <text x="314" y="778" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#BC9B6A">Vina affinities</text>

        <!-- seed examples into the proposer -->
        <rect x="530" y="76" width="330" height="70" rx="3" fill="#003262" fill-opacity="0.07" stroke="#003262" stroke-width="1.5" stroke-dasharray="5 4"></rect>
        <text x="548" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#003262">15 DOCKSTRING seed examples</text>
        <text x="548" y="127" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#003262" fill-opacity="0.72">reference only, never counted as results</text>
        <line x1="526" y1="111" x2="486" y2="111" stroke="#003262" stroke-width="2" marker-end="url(#ar-blue)"></line>

        <!-- rejected branch, out to the right of validate -->
        <line x1="482" y1="268" x2="524" y2="268" stroke="#BC9B6A" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar-gold)"></line>
        <rect x="530" y="232" width="330" height="72" rx="3" fill="#BC9B6A" fill-opacity="0.14" stroke="#BC9B6A" stroke-width="1.5" stroke-dasharray="5 4"></rect>
        <text x="548" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#003262">Rejected: unparseable, duplicate,</text>
        <text x="548" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#003262">filtered — saved with the reason</text>
        <path d="M695 306 L695 848 L486 848" fill="none" stroke="#BC9B6A" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar-gold)"></path>

        <!-- feedback arc: memory back up to the proposer -->
        <path d="M300 898 L300 962 L56 962 L56 124 L114 124" fill="none" stroke="#003262" stroke-width="2.5" marker-end="url(#ar-blue)"></path>
        <text x="320" y="990" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#003262">Next prompt: best predicted &amp; docked hits, diverse</text>
        <text x="320" y="1010" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#003262">examples, filter failures, scaffold and objective trends</text>
      </svg>